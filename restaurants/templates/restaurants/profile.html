{% extends 'base.html' %}

{% load static %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center" style="font-size: 2.5rem;">Profile</h2> <!-- Increased header font size -->

    <form method="post" class="d-flex justify-content-between">
        {% csrf_token %}
        <div class="row flex-grow-1"> <!-- Allow the left side to grow -->
            <div class="col-md-12"> <!-- Full width for User Information -->
                <h4 style="font-size: 1.8rem;">User Information</h4> <!-- Increased font size -->
                {{ user_form.as_p }}
            </div>
            <div class="col-md-12 mb-4"> <!-- Added margin bottom to the first row -->
                <h4 style="font-size: 1.8rem;">Profile Information</h4> <!-- Increased font size -->
                {{ profile_form.as_p }}
            </div>
        </div>
        <div class="text-center ms-4"> <!-- Icon and button container -->
            <i class="fas fa-user-circle" style="font-size: 20rem;"></i> <!-- Profile icon -->
            <div class="mt-3"> <!-- Margin top for spacing -->
                <button type="submit" class="btn btn-black">Update Profile</button> <!-- Button under the icon -->
            </div>
        </div>
    </form>
</div>

<style>
    .btn-black {
        background-color: black; /* Black background */
        color: white; /* White text color */
        border: none; /* Remove border */
    }

    .btn-black:hover {
        background-color: #333; /* Darker shade on hover */
        color: white; /* Maintain white text on hover */
    }
</style>
{% endblock %}
