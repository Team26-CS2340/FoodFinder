{% extends 'base.html' %}
{% load static %}

{% block title %}Home{% endblock %}

{% block content %}

<h1 style="text-align: center; margin: 30px 0;">Restaurant</h1>

<div class="container">
    <div class="row justify-content-center">
        <!-- Adjust column size for a larger card -->
        <div class="col-sm-12 col-md-10 col-lg-8">
            <div class="card shadow-lg d-flex justify-content-center align-items-center" style="width: 300px; height: 300px; border: 2px solid #ddd;">
                <!-- Image Inside the Card -->
                <img src="{% static 'path/to/your/image.jpg' %}" class="img-fluid" alt="Restaurant Image" style="width: 100%; height: auto; object-fit: cover;">
                <div class="card-body d-flex justify-content-center align-items-center" style="padding: 0.5rem;">
                    <!-- Add any additional content if needed -->
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
