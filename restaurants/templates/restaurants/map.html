<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map</title>
    <!-- Google Maps JavaScript API -->
    <script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&callback=initMap" defer></script>
    <style>
        /* Set the size of the map container */
        #map {
            height: 80vh;
            width: 100%;
        }
    </style>
</head>
<body>

    <h2 class="text-center">Interactive Map</h2>
    <!-- The map container -->
    <div id="map"></div>

    <script>
        // Initialize and add the map
        function initMap() {
            // Get the default location from the backend
            const defaultLocation = {
                lat: parseFloat('{{ default_location.lat }}'),
                lng: parseFloat('{{ default_location.lng }}')
            };
            
            // Create a map centered at the default location
            const map = new google.maps.Map(document.getElementById('map'), {
                zoom: 13,
                center: defaultLocation,
            });

            // Add a marker at the default location
            new google.maps.Marker({
                position: defaultLocation,
                map: map,
                title: 'Default Location',
            });

            // Attempt to get the user's location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                        };
                        
                        // Center the map on the user's location
                        map.setCenter(userLocation);
                        
                        // Add a marker at the user's location
                        new google.maps.Marker({
                            position: userLocation,
                            map: map,
                            title: 'Your Location',
                        });
                    },
                    () => {
                        console.error("Error: Unable to retrieve your location.");
                    }
                );
            } else {
                console.error("Error: Your browser doesn't support geolocation.");
            }
        }
    </script>

</body>
</html>
