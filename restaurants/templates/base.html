{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS if any -->
    <link rel="stylesheet" href="{% static 'restaurants/styles.css' %}">
</head>
<body>

    <!-- Header Section -->
    <header class="p-3 text-bg-dark">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                    <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap">
                        <use xlink:href="#bootstrap"></use>
                    </svg>
                </a>

                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="{% url 'home' %}" class="nav-link px-2 text-secondary">Home</a></li>
                    <li><a href="{% url 'restaurant_list' %}" class="nav-link px-2 text-white">Restaurants</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">Favorites</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">Map</a></li>
                    <li><a href="#" class="nav-link px-2 text-white">About</a></li>
                </ul>

                <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search" method="POST" action="{% url 'restaurant-search' %}">
                    {% csrf_token %}
                    <input type="search" name="restaurant_name" class="form-control form-control-dark text-bg-dark" placeholder="Search..." aria-label="Search">
                </form>                

                <div class="text-end">
                    <a href="{% url 'login' %}" class="btn btn-outline-light me-2">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-warning">Sign-up</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Section -->
    <div class="container">
        {% block content %}
        <!-- Your page-specific content will be inserted here -->
        {% endblock %}
    </div>

    <!-- Footer Section -->
    <div class="container">
        <footer class="py-3 my-4">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item"><a href="{% url 'home' %}" class="nav-link px-2 text-body-secondary">Home</a></li>
                <li class="nav-item"><a href="{% url 'restaurant_list' %}" class="nav-link px-2 text-body-secondary">Restaurants</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Favorites</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">About</a></li>
            </ul>
            <p class="text-center text-body-secondary">© 2024 Company, Inc</p>
        </footer>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
